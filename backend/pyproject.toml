[project]
name = "pokeplanet-web-api"
version = "0.1.0"
description = "Starlette API and web host for PokePlanet"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "starlette>=0.47,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S104", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]
"app/settings.py" = ["S105"]
