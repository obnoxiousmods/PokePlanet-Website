limit_req_zone $binary_remote_addr zone=pokeplanet_contact:10m rate=5r/h;

server {
    listen 80;
    listen [::]:80;
    server_name pokeplanet.obby.ca;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pokeplanet.obby.ca;

    ssl_certificate /etc/letsencrypt/live/pokeplanet/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pokeplanet/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 32k;

    # The native game's browser OAuth flow remains owned by the Rust world server.
    location = /login {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /auth/callback {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8790;
    }

    location = /api/contact {
        limit_req zone=pokeplanet_contact burst=2 nodelay;
        proxy_pass http://127.0.0.1:8791;
        include proxy_params;
    }
    location / {
        proxy_pass http://127.0.0.1:8791;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name pp.obby.ca pokemon.obby.ca pokeplanet.obnoxious.lol;
    return 308 https://pokeplanet.obby.ca$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pp.obby.ca pokemon.obby.ca pokeplanet.obnoxious.lol;
    ssl_certificate /etc/letsencrypt/live/pokeplanet/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pokeplanet/privkey.pem;
    return 308 https://pokeplanet.obby.ca$request_uri;
}

